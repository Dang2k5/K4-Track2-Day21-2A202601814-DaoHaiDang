name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from pathlib import Path

          credentials = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          if not credentials:
              raise SystemExit("STORAGE_CREDENTIALS secret is empty")
          Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]).write_text(
              credentials, encoding="utf-8"
          )
          PYEOF

      - name: Pull data with DVC
        run: |
          dvc remote add --force -d labstore "gs://${ARTIFACT_BUCKET}/dvc"
          dvc remote modify labstore credentialpath "$GOOGLE_APPLICATION_CREDENTIALS"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          with open("outputs/report.json", encoding="utf-8") as report_file:
              print(f"f1={json.load(report_file)['f1_score']}")
          PYEOF

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ["ARTIFACT_BUCKET"])
          blob = bucket.blob("artifacts/current/model.joblib")
          blob.upload_from_filename("models/model.joblib")
          print("Uploaded artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])
          threshold = 0.65
          print(f"f1_score={f1:.4f}, threshold={threshold:.2f}")
          if f1 < threshold:
              raise SystemExit("Quality gate failed: f1_score is below 0.65")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl --fail http://localhost:8080/healthz

name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Amazon S3
        run: |
          python - <<'PYEOF'
          import json
          import os

          credentials = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          if credentials:
              try:
                  values = json.loads(credentials)
              except json.JSONDecodeError as exc:
                  raise SystemExit("STORAGE_CREDENTIALS must contain valid AWS JSON") from exc
              access_key = values.get("aws_access_key_id") or values.get("AccessKeyId")
              secret_key = values.get("aws_secret_access_key") or values.get("SecretAccessKey")
              region = values.get("region") or values.get("aws_region")
              if not access_key or not secret_key:
                  raise SystemExit(
                      "STORAGE_CREDENTIALS JSON needs aws_access_key_id and aws_secret_access_key"
                  )
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"AWS_ACCESS_KEY_ID={access_key}\n")
                  env_file.write(f"AWS_SECRET_ACCESS_KEY={secret_key}\n")
                  if region:
                      env_file.write(f"AWS_DEFAULT_REGION={region}\n")

          if not os.environ.get("AWS_ACCESS_KEY_ID") and not credentials:
              raise SystemExit(
                  "Configure STORAGE_CREDENTIALS JSON or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              if not os.environ.get("AWS_DEFAULT_REGION"):
                  env_file.write("AWS_DEFAULT_REGION=ap-southeast-1\n")
          PYEOF

      - name: Pull data with DVC
        run: |
          dvc remote add --force -d labstore "s3://${ARTIFACT_BUCKET}/dvc"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          with open("outputs/report.json", encoding="utf-8") as report_file:
              print(f"f1={json.load(report_file)['f1_score']}")
          PYEOF

      - name: Upload model to Amazon S3
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          region = os.getenv("AWS_DEFAULT_REGION") or os.getenv("AWS_REGION")
          client = boto3.client("s3", region_name=region)
          client.upload_file(
              "models/model.joblib",
              os.environ["ARTIFACT_BUCKET"],
              "artifacts/current/model.joblib",
          )
          print("Uploaded s3 object artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])
          threshold = 0.65
          print(f"f1_score={f1:.4f}, threshold={threshold:.2f}")
          if f1 < threshold:
              raise SystemExit("Quality gate failed: f1_score is below 0.65")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl --fail http://localhost:8080/healthz

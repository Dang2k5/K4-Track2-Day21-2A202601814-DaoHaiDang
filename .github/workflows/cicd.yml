name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Amazon S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify S3 access
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ.get("ARTIFACT_BUCKET", "").strip()
          if not bucket or bucket.startswith("s3://") or "/" in bucket:
              raise SystemExit(
                  "ARTIFACT_BUCKET must be the bucket name only, for example: dang2k5"
              )
          region = os.environ.get("AWS_DEFAULT_REGION", "ap-southeast-1")
          client = boto3.client("s3", region_name=region)
          result = client.list_objects_v2(Bucket=bucket, Prefix="dvc/", MaxKeys=1)
          if not result.get("Contents"):
              raise SystemExit(
                  f"S3 bucket '{bucket}' has no DVC objects under dvc/. Run dvc push locally first."
              )
          print(f"S3 access OK: s3://{bucket}/dvc/")
          PYEOF

      - name: Pull data with DVC
        run: |
          dvc remote add --force -d labstore "s3://${ARTIFACT_BUCKET}/dvc"
          dvc pull -v data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          with open("outputs/report.json", encoding="utf-8") as report_file:
              print(f"f1={json.load(report_file)['f1_score']}")
          PYEOF

      - name: Upload model to Amazon S3
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          region = os.getenv("AWS_DEFAULT_REGION") or os.getenv("AWS_REGION")
          client = boto3.client("s3", region_name=region)
          client.upload_file(
              "models/model.joblib",
              os.environ["ARTIFACT_BUCKET"],
              "artifacts/current/model.joblib",
          )
          print("Uploaded s3 object artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])
          threshold = 0.65
          print(f"f1_score={f1:.4f}, threshold={threshold:.2f}")
          if f1 < threshold:
              raise SystemExit("Quality gate failed: f1_score is below 0.65")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl --fail http://localhost:8080/healthz
